<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Meeting -task</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="containar">
        <div class="child">
            <div class="child-1 child">
                <i id="font1" class="bi bi-mic-mute"></i>
                <i id="font2" class="bi bi-chevron-down"></i>
                <p>Audio</p>
            </div>
            <div class="child-2 child">
                <i id="font1" class="bi bi-camera-video-off">
                    <i id="font2" class="bi bi-chevron-down"></i>
                </i>
                <p>Video</p>
            </div>
            <div class="child-3 child">
                <i id="font1" class="bi bi-people"></i>
                <i id="font2" id="font1" class="bi bi-chevron-down"></i>
                <p>Participants</p>
            </div>
            <div class="child-4 child">
                <i id="font1" class="bi bi-chat"></i>
                <i id="font2" class="bi bi-chevron-down"></i>
                <p>Chats</p>
            </div>
            <div class="child-5 child">
                <i id="font3" class="bi bi-arrow-up-square"></i>
                <i id="font2" class="bi bi-chevron-down"></i>
                <p>Share</p>
            </div>
            <div class="child-6 child">
                <i id="font1" class="bi bi-pause-fill"></i>
                <i id="font2" class="bi bi-chevron-down"></i>
                <p>Pause</p>
            </div>
            <div class="child-7 child">
                <i id="font1" class="bi bi-person-video3"></i>
                <i id="font2" class="bi bi-chevron-down"></i>
                <p>layout</p>
            </div>
            <div class="child-8 child">
                <i id="font1" class="bi bi-pencil"></i>
                <i id="font2" class="bi bi-chevron-down"></i>
                <p>Annoted</p>
            </div>
            <div class="child-9 child">
                <i id="font1" class="bi bi-mouse"></i>
                <i id="font2" class="bi bi-chevron-down"></i>
                <p>Remote control</p>
            </div>
            <div class="child-10 child">
                <i id="font1" class="bi bi-subtract"></i>
                <i id="font2" class="bi bi-chevron-down"></i>
                <p>
                    Hide meeting
                </p>

            </div>
            <div class="child-11 child">
                <i id="font1" class="bi bi-three-dots"></i>
                <i id="font2" class="bi bi-chevron-down"></i>
                <p>more</p>
            </div>
        </div>
        <div class="containar-1">
            <div class="subchild">
                <i id="box1" class="bi bi-arrow-up-left"></i>
                <h4>You are screen Sharing</h4>
                <i id="box3" class="bi bi-shield-check"></i>
                <div id="box2" class="subchild-1">
                    <i id="box4" class="bi bi-stop-fill"></i>
                    <h5>Stop Sharing</h5>
                </div>
            </div>


        </div>

    </div>
</body>

</html>
